<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRẮC NGHIỆM ONLINE - TRẮC NGHIỆM SINH HỌC 11 - NĂM HỌC 2026-2027</title><style>body{font-family:"Times New Roman",serif;background:#eef6ff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{max-width:680px;width:100%;background:#fff;border:1px solid #dbeafe;border-radius:22px;padding:24px;box-shadow:0 15px 40px #1e40af22}h1{text-align:center;color:#003f9e;margin:0 0 6px}h2{text-align:center;color:#dc2626;margin:0 0 22px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}.role{text-align:center;background:#f8fbff;border:1px solid #dbeafe;border-radius:16px;padding:18px}button{border:0;border-radius:11px;padding:11px 15px;color:#fff;font:bold 16px "Times New Roman",serif;cursor:pointer}.hs{background:#0f766e}.gv{background:#1d4ed8}.cred{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;padding:8px 10px;background:#fff;border:1px solid #dbeafe;border-radius:9px}.copy{background:#64748b;font-size:13px;padding:7px 10px}#login{display:none;margin-top:16px;padding:16px;border:1px solid #bfdbfe;border-radius:14px;background:#f8fbff}#login.show{display:block}input{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #cbd5e1;border-radius:9px;font:16px "Times New Roman",serif}#err{color:#b91c1c;min-height:20px;font-weight:bold;text-align:center}@media(max-width:600px){.roles{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>TRẮC NGHIỆM ONLINE</h1><div class="roles"><section class="role"><div style="font-size:38px">🎓</div><h3>Tài khoản HS</h3><p>Không cần đăng nhập tại bước này.</p><button class="hs" onclick="location.href=CFG.student">Vào làm bài HS</button></section><section class="role"><div style="font-size:38px">👨‍🏫</div><h3>Tài khoản giáo viên</h3><p>Đăng nhập trước khi mở mục lục giáo viên.</p><button class="gv" onclick="showLogin()">Đăng nhập giáo viên</button></section></div><form id="login"><h3 style="text-align:center;color:#003f9e">Đăng nhập giáo viên</h3><label>Tên tài khoản</label><input id="u" required autocomplete="username"><label>Mật khẩu</label><input id="pw" type="password" required autocomplete="current-password"><div id="err"></div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="gv">Đăng nhập</button><button type="button" style="background:#64748b" onclick="hideLogin()">Quay lại</button></div></form><p style="text-align:center;color:#64748b;font-size:13px">GV. Bùi Minh Phương</p></main><script>const CFG={"student": "https://daohoamh.github.io/BMPdethionline1.io/Quiz/Online.html?data=aHR0cHM6Ly9naXN0LmdpdGh1YnVzZXJjb250ZW50LmNvbS9kYW9ob2FtaC8zOWM4NDYzNGQxMjhlOTljY2YzYjdhODAxZjFjOWIyYS9yYXcvbXVjLWx1Yy1ob2Mtc2luaC5odG1sP2JtcF9jYXRhbG9nPXYxMTk0", "teacher": "https://daohoamh.github.io/BMPdethionline1.io/Quiz/Online.html?data=aHR0cHM6Ly9naXN0LmdpdGh1YnVzZXJjb250ZW50LmNvbS9kYW9ob2FtaC8zOWM4NDYzNGQxMjhlOTljY2YzYjdhODAxZjFjOWIyYS9yYXcvbXVjLWx1Yy1naWFvLXZpZW4uaHRtbD9ibXBfY2F0YWxvZz12MTE5NA==", "user": "GV666325", "hash": "56abfd371077838cb82cad6999a6690b8978285134aa7c41c07e303f99538250"};const loginBox=document.getElementById('login'), userBox=document.getElementById('u'), passBox=document.getElementById('pw'), errorBox=document.getElementById('err');function showLogin(){loginBox.className='show';userBox.value='';passBox.value='';passBox.focus()}function hideLogin(){loginBox.className='';errorBox.textContent=''}async function digest(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}loginBox.addEventListener('submit',async e=>{e.preventDefault();errorBox.textContent='';if(userBox.value.trim().toLowerCase()===CFG.user.toLowerCase()&&await digest(passBox.value)===CFG.hash)location.replace(CFG.teacher);else errorBox.textContent='Sai tên tài khoản hoặc mật khẩu giáo viên.'});</script></body></html>
